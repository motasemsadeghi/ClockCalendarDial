<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ساعت و تقویم">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ساعت و تقویم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1f;--mute:#6b6b70;--sec:#d13b2e;--tile:#fffdf8;--tick:#9a9a9f;--H:100vh;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@supports(height:100dvh){:root{--H:100dvh}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--fg:#ececef;--mute:#98989f;--sec:#ff6a5c;--tile:#1d1d21;--tick:#5d5d64}}
:root[data-theme="dark"]{--bg:#141416;--fg:#ececef;--mute:#98989f;--sec:#ff6a5c;--tile:#1d1d21;--tick:#5d5d64}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:var(--H);padding:10px;gap:10px;box-sizing:border-box}
#app{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
#app[data-mode="col"]{flex-direction:column}
#app[data-mode="row"]{flex-direction:row}
.sep{background:var(--fg);opacity:.3;border-radius:2px;flex:none}
#app[data-mode="col"] .sep{width:70%;height:2px}
#app[data-mode="row"] .sep{width:2px;align-self:stretch;margin:6vh 0}
svg{display:block;height:auto;direction:ltr;filter:drop-shadow(0 8px 16px rgba(0,0,0,.18))}
#app[data-mode="col"] svg{width:min(94vw,calc((var(--H) - 110px)/2))}
#app[data-mode="row"] svg{width:min(calc((100vw - 50px)/2),calc(var(--H) - 90px))}
#lay{font:inherit;font-size:14px;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:2px solid var(--fg);background:var(--tile);color:var(--fg);cursor:pointer}
#lay svg{width:20px;height:20px;filter:none}
.frame{fill:var(--tile);stroke:var(--fg);stroke-width:5}
.arc{fill:none;stroke:var(--fg);stroke-width:2.5}
.hand{stroke-linecap:round}
.tip{stroke:var(--tile);stroke-width:2}
#clk .tk{stroke:var(--tick);stroke-width:1.5}
#clk .lbl{font-size:15px;fill:var(--mute);text-anchor:middle;dominant-baseline:central}
#cal .tk{stroke:var(--tick);stroke-width:1.2}
#cal .lbl{font-size:9px;fill:var(--fg);text-anchor:middle;dominant-baseline:central;transition:font-size .3s}
.wd{direction:ltr;unicode-bidi:bidi-override}
#cal .lbl.off{fill:var(--tick);opacity:.55}
#cal .tk.off{opacity:.25}
#cal .lbl.act{font-size:12px;font-weight:700;fill:var(--fg)}
</style>
</head>
<body>
<main id="app" data-mode="col">
<svg viewBox="0 0 400 400" id="clk" role="img" aria-label="ساعت"><g id="tile"></g></svg>
<div class="sep"></div>
<svg viewBox="0 0 400 400" id="cal" role="img" aria-label="تقویم"></svg>
</main>
<button id="lay" type="button"></button>
<script>
(function(){
const NS="http://www.w3.org/2000/svg",PX=33,PY=367;
const R={s:322,m:235,h:148};
const fa=n=>Number(n).toLocaleString("fa-IR",{useGrouping:false});
const tile=document.getElementById("tile");
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||tile).appendChild(e);return e}
const pt=(r,t)=>[PX+r*Math.sin(t*Math.PI/180),PY-r*Math.cos(t*Math.PI/180)];
el("rect",{x:6,y:6,width:388,height:388,rx:44,class:"frame"});
const labelG=el("g",{}),tickG=el("g",{});
for(const k in R){const r=R[k];el("path",{d:`M ${PX} ${PY-r} A ${r} ${r} 0 0 1 ${PX+r} ${PY}`,class:"arc"})}
const hands={
 h:el("line",{class:"hand",stroke:"var(--mute)","stroke-width":6}),
 m:el("line",{class:"hand",stroke:"var(--fg)","stroke-width":4}),
 s:el("line",{class:"hand",stroke:"var(--sec)","stroke-width":2.5})};
const tips={s:el("circle",{r:6,fill:"var(--sec)",class:"tip"}),m:el("circle",{r:6,fill:"var(--fg)",class:"tip"}),h:el("circle",{r:7,fill:"var(--mute)",class:"tip"})};
el("circle",{cx:PX,cy:PY,r:10,fill:"var(--tile)",stroke:"var(--fg)","stroke-width":3.5});
el("circle",{cx:PX,cy:PY,r:3.5,fill:"var(--sec)"});

// tick geometry: s,m = 15 units per quarter; h = 6 units
const cfg={s:{n:15,step:5},m:{n:15,step:5},h:{n:6,step:1}};
const texts={};
for(const k in cfg){
  const {n,step}=cfg[k],r=R[k];
  for(let i=0;i<=n;i++){const t=90*i/n,len=(i%step===0)?10:5;
    const a=pt(r,t),b=pt(r-len,t);
    el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:"tk"},tickG)}
  texts[k]=[];
  for(let i=0;i<=n;i+=step){const t=90*i/n,p=pt(r+15,t);
    texts[k].push({i,x:p[0],y:p[1],e:el("text",{class:"lbl",x:p[0],y:p[1]},labelG)})}
}
const sets={s:60,m:60,h:24};
function setLabels(k,q){
  const per=k==="h"?6:15;
  texts[k].forEach(o=>{let v=q*per+o.i;if(v>=sets[k]&&k!=="h")v-=sets[k];o.e.textContent=fa(v)});
}
const now=()=>new Date();
const qs={s:-1,m:-1,h:-1},disp={s:0,m:0,h:0};
let rot=null,n=0,lastQ=null;
const ease=(a,b,f)=>a+(b-a)*f;
function frame(){
  const d=now(),ms=d.getMilliseconds();
  const s=d.getSeconds()+ms/1000,m=d.getMinutes()+s/60,h=d.getHours()+m/60;
  const val={s,m,h},per={s:15,m:15,h:6};
  for(const k of ["s","m","h"]){
    const q=Math.floor(val[k]/per[k]),loc=(val[k]%per[k])/per[k]*90;
    if(q!==qs[k]){qs[k]=q;setLabels(k,q)}
    if(Math.abs(disp[k]-loc)>1.5)disp[k]=ease(disp[k],loc,.1);else disp[k]=loc;
    const p=pt(R[k],disp[k]),H=hands[k];
    H.setAttribute("x1",PX);H.setAttribute("y1",PY);H.setAttribute("x2",p[0]);H.setAttribute("y2",p[1]);
    tips[k].setAttribute("cx",p[0]);tips[k].setAttribute("cy",p[1]);
  }
  // page rotation
  const q=qs.h;
  if(rot===null){rot=90*q;n=q;lastQ=q}
  if(q!==lastQ){n+=(q-lastQ+4)%4;lastQ=q}
  rot=Math.abs(rot-90*n)>.05?ease(rot,90*n,.06):90*n;
  tile.setAttribute("transform",`rotate(${rot} 200 200)`);
  for(const k in texts)texts[k].forEach(o=>o.e.setAttribute("transform",`rotate(${-rot} ${o.x} ${o.y})`));
  requestAnimationFrame(frame);
}
frame();

})();
(function(){
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("cal");
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
const fa=n=>Number(n).toLocaleString("fa-IR",{useGrouping:false});
const PA=[33,367],PB=[367,33];
// dial A: from east (a=0) counter-clockwise to north (a=90); dial B: from south (a=0) clockwise to west (a=90)
const pos=(D,r,a)=>{const t=a*Math.PI/180;return D==="A"?[PA[0]+r*Math.cos(t),PA[1]-r*Math.sin(t)]:[PB[0]-r*Math.sin(t),PB[1]+r*Math.cos(t)]};
const WD=["ش","ش۱","ش۲","ش۳","ش۴","ش۵","ج"];
const S=[
 {id:"wd",D:"A",r:100,n:7, lab:i=>WD[i],col:"var(--mute)",w:4},
 {id:"jd",D:"A",r:165,n:31,lab:i=>fa(i+1),col:"var(--fg)",w:4},
 {id:"gd",D:"A",r:230,n:31,lab:i=>String(i+1),col:"var(--sec)",w:4},
 {id:"jm",D:"B",r:120,n:12,lab:i=>fa(i+1),col:"var(--fg)",w:4},
 {id:"gm",D:"B",r:185,n:12,lab:i=>String(i+1),col:"var(--sec)",w:4}];
el("rect",{x:6,y:6,width:388,height:388,rx:44,class:"frame"});
for(const s of S){
  const P=s.D==="A"?PA:PB,r=s.r;
  el("path",{d:s.D==="A"?`M ${P[0]+r} ${P[1]} A ${r} ${r} 0 0 0 ${P[0]} ${P[1]-r}`:`M ${P[0]} ${P[1]+r} A ${r} ${r} 0 0 1 ${P[0]-r} ${P[1]}`,class:"arc"});
  s.labels=[];s.ticks=[];
  for(let i=0;i<s.n;i++){
    const a=90*i/(s.n-1),p1=pos(s.D,r,a),p2=pos(s.D,r-6,a),pl=pos(s.D,r+13,a);
    s.ticks.push(el("line",{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],class:"tk"}));
    const t=el("text",{x:pl[0],y:pl[1],class:s.id==="wd"?"lbl wd":"lbl"});t.textContent=s.lab(i);s.labels.push(t);
  }
}
for(const s of S){
  s.hand=el("line",{class:"hand",stroke:s.col,"stroke-width":s.w});
  s.tip=el("circle",{r:6,fill:s.col,class:"tip"});
  s.disp=null;s.cur=-1;
}
for(const P of [PA,PB]){
  el("circle",{cx:P[0],cy:P[1],r:12,fill:"var(--tile)",stroke:"var(--fg)","stroke-width":3.5});
  el("circle",{cx:P[0],cy:P[1],r:3.5,fill:"var(--sec)"});
}
const fmt=new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn",{year:"numeric",month:"numeric",day:"numeric"});
function dates(){
  const d=new Date(),P=fmt.formatToParts(d),g=t=>+P.find(x=>x.type===t).value;
  return {wd:(d.getDay()+1)%7+1,jd:g("day"),gd:d.getDate(),jm:g("month"),gm:d.getMonth()+1};
}
function jLen(){
  const n=new Date();let last=0,m0=null;
  for(let k=0;k<32;k++){
    const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+k,12),P=fmt.formatToParts(d),g=t=>+P.find(x=>x.type===t).value,m=g("month");
    if(m0===null)m0=m;if(m!==m0)break;last=g("day");
  }
  return last;
}
function setLens(){
  const n=new Date(),L={jd:jLen(),gd:new Date(n.getFullYear(),n.getMonth()+1,0).getDate()};
  for(const s of S){if(!L[s.id])continue;
    s.labels.forEach((t,i)=>t.classList.toggle("off",i>=L[s.id]));
    s.ticks.forEach((t,i)=>t.classList.toggle("off",i>=L[s.id]));}
}
let lastKey="";
function frame(){
  const D=dates(),key=D.jm+"/"+D.jd+"/"+D.gm+"/"+D.gd;
  if(key!==lastKey){lastKey=key;setLens();}
  for(const s of S){
    const idx=D[s.id]-1,t=90*idx/(s.n-1);
    if(s.cur!==idx){
      if(s.cur>=0)s.labels[s.cur].classList.remove("act");
      s.labels[idx].classList.add("act");s.cur=idx;
      if(s.disp===null)s.disp=t;
    }
    s.disp=Math.abs(s.disp-t)>.05?s.disp+(t-s.disp)*.07:t;
    const P=s.D==="A"?PA:PB,p=pos(s.D,s.r,s.disp);
    s.hand.setAttribute("x1",P[0]);s.hand.setAttribute("y1",P[1]);s.hand.setAttribute("x2",p[0]);s.hand.setAttribute("y2",p[1]);
    s.tip.setAttribute("cx",p[0]);s.tip.setAttribute("cy",p[1]);
  }
  requestAnimationFrame(frame);
}
frame();

})();
(function(){
const app=document.getElementById("app"),btn=document.getElementById("lay");
let mode=null;
try{mode=localStorage.getItem("layout")}catch(e){}
if(mode!=="row"&&mode!=="col")mode=innerWidth>innerHeight?"row":"col";
const ico={
 row:'<svg viewBox="0 0 20 20"><rect x="2" y="3" width="7" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="11" y="3" width="7" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 col:'<svg viewBox="0 0 20 20"><rect x="3" y="2" width="14" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="11" width="14" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>'};
function apply(){
  app.dataset.mode=mode;
  btn.innerHTML=ico[mode==="col"?"row":"col"]+"<span>"+(mode==="col"?"کنار هم":"زیر هم")+"</span>";
  try{localStorage.setItem("layout",mode)}catch(e){}
}
btn.onclick=()=>{mode=mode==="col"?"row":"col";apply()};
apply();
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
